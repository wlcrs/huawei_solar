forcible_charge:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: huawei_solar
          model: "Batteries"
    duration:
      required: true
      default: 60
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: "minutes"
          mode: box
    power:
      required: true
      default: 1000
      selector:
        number:
          min: 1
          unit_of_measurement: "W"
          mode: box

forcible_discharge:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: huawei_solar
          model: "Batteries"
    duration:
      required: true
      default: 60
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: "minutes"
          mode: box
    power:
      required: true
      default: 1000
      selector:
        number:
          min: 1
          unit_of_measurement: "W"
          mode: box

forcible_charge_soc:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: huawei_solar
          model: "Batteries"
    target_soc:
      required: true
      default: 50
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    power:
      required: true
      default: 1000
      selector:
        number:
          min: 1
          unit_of_measurement: "W"
          mode: box

forcible_discharge_soc:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: huawei_solar
          model: "Batteries"
    target_soc:
      required: true
      default: 15
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    power:
      required: true
      default: 1000
      selector:
        number:
          min: 1
          unit_of_measurement: "W"
          mode: box

stop_forcible_charge:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: huawei_solar
          model: "Batteries"

reset_maximum_feed_grid_power:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: huawei_solar

set_di_active_power_scheduling:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: huawei_solar

set_zero_power_grid_connection:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: huawei_solar

set_maximum_feed_grid_power:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: huawei_solar
    power:
      required: true
      default: 0
      selector:
        number:
          min: -1000
          unit_of_measurement: "W"
          mode: box

set_maximum_feed_grid_power_percent:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: huawei_solar
    power_percentage:
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

set_tou_periods:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: huawei_solar
    periods:
      required: true
      example: "00:00-06:00/1234567/+\n06:00-24:00/1234567/-"
      selector:
        text:
          multiline: true

set_capacity_control_periods:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: huawei_solar
          model: "Batteries"
    periods:
      required: true
      example: "00:00-06:00/1234567/5000W\n06:00-24:00/1234567/0W"
      selector:
        text:
          multiline: true

set_fixed_charge_periods:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: huawei_solar
          model: "Batteries"
    periods:
      required: true
      example: "00:00-06:00/1000W\n12:00-14:00/500W"
      selector:
        text:
          multiline: true
